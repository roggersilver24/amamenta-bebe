name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  family-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm run test:emulator --prefix backend
  build:
    needs: family-rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      INSTALLED_CERT_SHA256: ${{ vars.INSTALLED_CERT_SHA256 }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      PIX_COPY_PASTE: ${{ vars.PIX_COPY_PASTE }}
      PIX_BENEFICIARY: ${{ vars.PIX_BENEFICIARY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Restore original signing key when available
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' && env.INSTALLED_CERT_SHA256 != ''
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/original.jks"
          echo "ANDROID_SIGNING_STORE=$RUNNER_TEMP/original.jks" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$RUNNER_TEMP/original.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" -file "$RUNNER_TEMP/signing.der"
          actual=$(sha256sum "$RUNNER_TEMP/signing.der" | cut -d ' ' -f 1)
          expected=$(printf '%s' "$INSTALLED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          echo "Keystore certificate SHA-256: $actual"
          test "$actual" = "$expected"
      - name: Unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease --stacktrace 2>&1 | tee gradle.log
      - name: Report Gradle failure
        if: failure()
        shell: bash
        run: |
          echo "### Gradle failure" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e:| error: |ERROR|FAILURE|Compilation error|Unresolved reference|Task .* FAILED)' gradle.log | tail -n 50 > gradle-errors.log || true
          tail -n 100 gradle.log >> "$GITHUB_STEP_SUMMARY"
          details=$(awk '/^\* What went wrong:/{capture=1} /^\* Try:/{capture=0} capture' gradle.log)
          causes=$(grep -E '^(Caused by:|[[:space:]]*> |Execution failed for task|ERROR:|.*Dex.*error)' gradle.log | head -n 80 || true)
          details="$details"$'\n--- causes ---\n'"$causes"
          if [ -z "$details" ]; then details=$(tail -n 150 gradle.log); fi
          details=${details//'%'/'%25'}
          details=${details//$'\r'/'%0D'}
          details=${details//$'\n'/'%0A'}
          echo "::error title=Gradle build failed::$details"
      - name: Verify update signature before distribution
        if: env.ANDROID_SIGNING_STORE != ''
        shell: bash
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk > certificate.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificate.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')
          expected=$(printf '%s' "$INSTALLED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test ${#expected} -eq 64
          test "$actual" = "$expected"
          cp app/build/outputs/apk/release/app-release.apk amamenta-bebe.apk
      - name: Explain blocked update
        if: env.ANDROID_SIGNING_STORE == ''
        run: |
          echo 'Build/tests validated. APK distribution blocked: original keystore and installed certificate SHA-256 required to preserve installed data.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK
        if: env.ANDROID_SIGNING_STORE != ''
        uses: actions/upload-artifact@v4
        with:
          name: Amamenta-Bebe-APK
          path: amamenta-bebe.apk
          if-no-files-found: error
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Amamenta-Bebe-Validation
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            gradle.log
          if-no-files-found: warn
