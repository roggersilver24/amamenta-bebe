name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee gradle.log
      - name: Report Gradle failure
        if: failure()
        shell: bash
        run: |
          echo "### Gradle failure" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(^e:| error: |ERROR|FAILURE|Compilation error|Unresolved reference|Task .* FAILED)' gradle.log | tail -n 50 > gradle-errors.log || true
          tail -n 100 gradle.log >> "$GITHUB_STEP_SUMMARY"
          details=$(tail -n 100 gradle.log)
          details=${details//'%'/'%25'}
          details=${details//$'\r'/'%0D'}
          details=${details//$'\n'/'%0A'}
          echo "::error title=Gradle build failed::$details"
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk amamenta-bebe.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amamenta-Bebe-APK
          path: amamenta-bebe.apk
          if-no-files-found: error
