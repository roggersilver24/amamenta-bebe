name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Unit tests and lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug --stacktrace 2>&1 | tee gradle.log
      - name: Report Gradle failure
        if: failure()
        shell: bash
        run: |
          echo "### Gradle failure" >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 gradle.log >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 gradle.log | while IFS= read -r line; do
            safe_line=${line//'%'/'%25'}
            safe_line=${safe_line//$'\r'/'%0D'}
            safe_line=${safe_line//$'\n'/'%0A'}
            echo "::error::$safe_line"
          done
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Prepare artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk amamenta-bebe.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Amamenta-Bebe-APK
          path: amamenta-bebe.apk
          if-no-files-found: error
